<circle cx="160.0" cy="48.0" r="1.4" fill="none" stroke="#000" stroke-width="0.35"/>
<text x="140.5" y="63.50" font-size="3.0" font-family="Helvetica, Arial, sans-serif">SERVE in a dining room: each</text>
<text x="140.5" y="67.40" font-size="3.0" font-family="Helvetica, Arial, sans-serif">guest there gets a patience</text>
<text x="140.5" y="71.30" font-size="3.0" font-family="Helvetica, Arial, sans-serif">marker. Put 1 new dish in the</text>
<text x="140.5" y="75.20" font-size="3.0" font-family="Helvetica, Arial, sans-serif">dining room. The basket then</text>
<text x="140.5" y="79.10" font-size="3.0" font-family="Helvetica, Arial, sans-serif">starts over where it began, empty.</text>
</g>
