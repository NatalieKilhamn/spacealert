<text x="22.5" y="41.1" font-size="8.5" font-weight="bold" font-family="Helvetica, Arial, sans-serif">1–3</text>
<rect x="43.70" y="33.10" width="9" height="9" rx="0.6" fill="#fff" stroke="#000" stroke-width="0.4"/>
<text x="22.5" y="48.5" font-size="3.8" font-weight="bold" font-family="Helvetica, Arial, sans-serif">SERVE</text>
<circle cx="42.0" cy="47.199999999999996" r="2.6" fill="#fff" stroke="#000" stroke-width="0.35"/>
<circle cx="42.0" cy="47.199999999999996" r="1.4" fill="none" stroke="#000" stroke-width="0.35"/>
<text x="22.5" y="63.50" font-size="3.0" font-family="Helvetica, Arial, sans-serif">SERVE: each player in the room</text>
<text x="22.5" y="67.40" font-size="3.0" font-family="Helvetica, Arial, sans-serif">gets a coffee cup, which holds</text>
<text x="22.5" y="71.30" font-size="3.0" font-family="Helvetica, Arial, sans-serif">1 stress. Put 1 new dish in the</text>
<text x="22.5" y="75.20" font-size="3.0" font-family="Helvetica, Arial, sans-serif">room. The coffee then starts</text>
<text x="22.5" y="79.10" font-size="3.0" font-family="Helvetica, Arial, sans-serif">over on the prep area, empty.</text>
</g>
