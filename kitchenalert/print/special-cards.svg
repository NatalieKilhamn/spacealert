<rect x="81.50" y="33.30" width="9" height="9" rx="0.6" fill="#fff" stroke="#000" stroke-width="0.4"/>
<rect x="92.10" y="33.30" width="9" height="9" rx="0.6" fill="#fff" stroke="#000" stroke-width="0.4"/>
<rect x="102.70" y="33.30" width="9" height="9" rx="0.6" fill="#fff" stroke="#000" stroke-width="0.4"/>
<text x="81.5" y="63.50" font-size="3.0" font-family="Helvetica, Arial, sans-serif">When an order whose next step</text>
<text x="81.5" y="67.40" font-size="3.0" font-family="Helvetica, Arial, sans-serif">is prep is put on this prep area,</text>
<text x="81.5" y="71.30" font-size="3.0" font-family="Helvetica, Arial, sans-serif">move cubes from here to it, as</text>
<text x="81.5" y="75.20" font-size="3.0" font-family="Helvetica, Arial, sans-serif">many as the step needs. PREP</text>
<text x="81.5" y="79.10" font-size="3.0" font-family="Helvetica, Arial, sans-serif">chooses mise en place only if</text>
<text x="81.5" y="83.00" font-size="3.0" font-family="Helvetica, Arial, sans-serif">no order can be chosen.</text>
</g>
