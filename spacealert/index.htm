<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<style type="text/css">
body {
padding: 0px;
margin: 0px;
background-color: black;
}

#center {
margin: 0 auto;
width: 958px;
height: 960px;
position: relative;
background-image: url("images/background.jpg");
background-position: center top;
background-repeat: no-repeat;
}

h1 {
 font-size: 12pt;
 font-family: "Sans";
 padding: 0px;
 margin: 0px;
 color: #ab3314;
}

#missionbox {
position: absolute;
top: 380px;
left: 430px;
}

.box {
border: 1px solid #191970;
padding: 10px;
background-color: rgba(25,25,112,0.45);
}
.box table, .box form {
margin: 0px;
padding: 0px;
color: white;
}
.box table {
margin-bottom: 5px;
}
.box td {
vertical-align: top;
}
.box button {
padding: 0px 25px;
}
</style>
</head>
<body>
<div id="center">
<div id="missionbox" class="box">
<h1>Play Mission</h1>
<form action="player.htm" method="get">
<table>
<tr>
<td style="padding-right: 40px;">Players:</td>
<td>
<input type="radio" name="players" value="4" id="p4" checked><label for="p4">4 Players</label>
&nbsp;
<input type="radio" name="players" value="5" id="p5"><label for="p5">5 Players</label>
</td>
</tr>
<tr>
<td style="padding-top: 8px;">Mission type:</td>
<td style="padding-top: 8px;"><select name="type" id="type"></select></td>
</tr>
<tr>
<td style="padding-top: 8px;">Mission:</td>
<td style="padding-top: 8px;"><select name="mission" id="mission"></select></td>
</tr>
</table>
<button type="submit" style="float:right; margin-top: 8px;">Play</button>
</form>
</div>

<script type="text/javascript">
// Injected by server.py so that the menu and the server always agree about
// which mission types and missions exist.
var CATALOGUE = /* CATALOGUE */;

var typeSelect = document.getElementById("type");
var missionSelect = document.getElementById("mission");

function option(value, label) {
    var o = document.createElement("option");
    o.value = value;
    o.textContent = label;
    return o;
}

for (var i = 0; i < CATALOGUE.length; i++)
    typeSelect.appendChild(option(CATALOGUE[i].key, CATALOGUE[i].label));

function fillMissions() {
    var type = CATALOGUE[typeSelect.selectedIndex];
    missionSelect.innerHTML = "";
    missionSelect.appendChild(option("random", "Randomly chosen"));
    // "Generate new" only appears for types the generator can actually build.
    if (type.generate)
        missionSelect.appendChild(option("generate", "Generate new"));
    for (var i = 0; i < type.scripts.length; i++)
        missionSelect.appendChild(option(type.scripts[i][0], type.scripts[i][1]));
    missionSelect.selectedIndex = 0; // default: randomly chosen
}

typeSelect.addEventListener("change", fillMissions);
typeSelect.selectedIndex = 0; // default: regular mission
fillMissions();
</script>

<button type="button" style="position:absolute; bottom: 100px; right: 20px;" onclick="location.href='/exit.htm'">Exit</button>
</div>
</body>
</html>
