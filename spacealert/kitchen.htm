<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>Kitchen Alert</title>
<style type="text/css">
body {
  margin: 0;
  background-color: #1a120b;
  color: #ffe6cc;
  font-family: sans-serif;
}
#box {
  width: 420px;
  margin: 120px auto 0 auto;
  padding: 20px 24px;
  border: 2px solid #ff9a3c;
  border-radius: 6px;
  background-color: rgba(255, 154, 60, 0.08);
}
h1 {
  margin: 0 0 4px 0;
  font-size: 22pt;
  color: #ff9a3c;
}
p.sub {
  margin: 0 0 18px 0;
  font-size: 10pt;
  color: #c9a27e;
}
td {
  padding: 6px 12px 6px 0;
  vertical-align: top;
}
button {
  padding: 4px 24px;
}
#links {
  width: 420px;
  margin: 14px auto;
  font-size: 10pt;
}
#links a, #links button {
  color: #c9a27e;
}
</style>
</head>
<body>
<div id="box">
<h1>Kitchen Alert</h1>
<p class="sub">Service player. Orders, deliveries and rush hours are announced in English.</p>
<form action="service.htm" method="get">
<table>
<tr>
<td>Players:</td>
<td>
<input type="radio" name="players" value="4" id="p4" checked><label for="p4">4 players</label>
&nbsp;
<input type="radio" name="players" value="5" id="p5"><label for="p5">5 players</label>
</td>
</tr>
<tr>
<td>Service:</td>
<td><select name="service" id="service"></select></td>
</tr>
</table>
<button type="submit" style="float: right;">Open the doors</button>
<div style="clear: both;"></div>
</form>
</div>
<div id="links">
<a href="index.htm">Space Alert missions</a>
<button type="button" style="float: right;" onclick="location.href='/exit.htm'">Exit</button>
</div>

<script type="text/javascript">
// Injected by server.py: [[value, label], ...]
var SERVICES = /* SERVICES */;
var select = document.getElementById("service");
for (var i = 0; i < SERVICES.length; i++) {
    var o = document.createElement("option");
    o.value = SERVICES[i][0];
    o.textContent = SERVICES[i][1];
    select.appendChild(o);
}
</script>
</body>
</html>
